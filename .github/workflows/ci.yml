name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A failed run tells you nothing if a later push is already superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Dependency security gates (AST-181 H-03). `mix hex.audit` checks the lock
  # against Hex retirements and advisories; `mix_audit` reads its own
  # advisory database, and the two have disagreed (SDLC-96), so both run.
  # mix_audit is installed as an escript so the package's mix.exs and lock
  # stay untouched.
  audit:
    name: hex.audit + deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix escript.install --force hex mix_audit
      - run: ~/.mix/escripts/mix_audit
